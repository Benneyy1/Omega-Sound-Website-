<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omega Sound — Creative Presence</title>
  <meta name="description" content="Your body already speaks music. Omega lets you hear it.">

  <!-- intro.css must load first — sets elements to opacity:0 before render -->
  <link rel="stylesheet" href="css/intro.css?v=20">
  <!-- Styles: tokens + reset first, then hero-specific layout -->
  <link rel="stylesheet" href="css/base.css?v=25">
  <link rel="stylesheet" href="css/video-hero.css?v=26">
  <link rel="stylesheet" href="css/hero.css?v=22">
  <link rel="stylesheet" href="css/section2.css?v=55">
  <link rel="stylesheet" href="css/section2-form.css?v=20">
  <link rel="stylesheet" href="css/popup.css?v=1">

  <!-- No Google Fonts CDN — system serif fallback in effect -->

  <!-- reCAPTCHA v3 — renders invisibly, scores on submit -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LfFj88sAAAAALtIPMLKS2R921HBlHDBfWScU63F"></script>
</head>

<body>
  <!-- omega_dunes_bg.js auto-injects its WebGL canvas as body's first child -->

  <main>

    <!-- ══════════════════════════════════════════════════════════════
         VIDEO HERO — Full-viewport ambient background with play trigger
         ⚠️  Video (70 MB): compress for production with ffmpeg:
             ffmpeg -i assets/omega_hero_bg.mp4 \
               -vcodec libx264 -crf 23 -preset slow -an -movflags +faststart \
               assets/omega_section_hero_bg.mp4
             Target < 10 MB.
         ══════════════════════════════════════════════════════════════ -->
    <section class="hero-video" aria-label="Omega hero">

      <video
        class="hero-video__bg"
        src="assets/omega_hero_bg.mp4"
        poster="assets/OmegaBackground.png"
        autoplay
        muted
        loop
        playsinline
        aria-hidden="true"
      ></video>

      <div class="hero-video__overlay" aria-hidden="true"></div>

      <!-- Play trigger — bottom-left of video canvas -->
      <button
        id="video-play-trigger"
        class="hero-video__play"
        type="button"
        aria-label="Play Omega video"
      >
        <svg class="hero-video__play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <polygon points="3,1 15,8 3,15"/>
        </svg>
        Play video
      </button>

    </section>

    <section class="section-two" aria-label="Section Two">

      <!-- Hero title + subtitle — positioned 1/6th down from section-two top -->
      <div class="hero-video__content">
        <h1 class="hero-video__title">The<br>Omega</h1>
        <p class="hero-video__subtitle">Discover your<br>Musical Creativity</p>
      </div>

    </section>

  </main>

  <!-- Site banner — body-level so position:fixed z-index:500 competes directly
       in the root stacking context, above section-two's sticky stacking context. -->
  <header class="site-banner" role="banner">
    <div class="hero__logo-group">

      <div class="hero__logo-socials" aria-hidden="true">
        <a href="https://www.instagram.com/omegasound/" class="hero__social-link" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
          <img src="assets/instagram.png" alt="Instagram" draggable="false">
        </a>
        <a href="https://www.linkedin.com/company/omegasound/about/?viewAsMember=true" class="hero__social-link" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
          <img src="assets/linkedin.png" alt="LinkedIn" draggable="false">
        </a>
        <a href="https://www.youtube.com/@OmegaSoundInc" class="hero__social-link" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
          <img src="assets/youtube.png" alt="YouTube" draggable="false">
        </a>
      </div>

      <a class="hero__logo" href="index.html" aria-label="Omega Sound — home">
        <img src="assets/omega_logo.png" alt="Omega Sound" draggable="false">
      </a>

      <nav class="hero__logo-nav" aria-label="Site navigation">
        <a href="demo.html" class="hero__logo-nav-item">Demo</a>
        <a href="about.html" class="hero__logo-nav-item">About</a>
        <a href="blog.html" class="hero__logo-nav-item">Blog</a>
      </nav>

    </div>
  </header>

  <!-- Footer logo group — body-level so z-index competes in the root stacking
       context, above .hands-connected (z-index:5). Inside section-two its
       z-index was trapped inside that sticky stacking context. -->
  <div class="footer__logo-group">

    <!-- Copyright — appears to the left on hover -->
    <span class="footer__logo-left" aria-hidden="true">© 2026 Omega Sound Inc.</span>

    <!-- Omega logo — starts flipped 180°, rotates upright on hover -->
    <div class="footer__logo" aria-label="Omega Sound">
      <img src="assets/omega_logo.png" alt="Omega Sound" draggable="false">
    </div>

    <!-- Rights — appears to the right on hover -->
    <span class="footer__logo-right" aria-hidden="true">All rights reserved.</span>

  </div>

  <!-- Connected-hands image — direct child of body so mix-blend-mode:screen
       blends against the WebGL canvas backdrop with no intermediate stacking
       context in the way. Spans hero + section two; intersection at ~100vh. -->
  <img
    class="hands-connected"
    src="assets/omega_handcropped.png"
    alt=""
    role="presentation"
    loading="eager"
    draggable="false"
  >

  <!--
    omega_dunes_bg.js — plain script tag, not a module.
    Auto-initializes on DOMContentLoaded via internal _boot().
    Loads Three.js r128 from CDN if not already present on window.
    Inserts its WebGL canvas as body's first child at z-index:-1.
    No inline JS anywhere in this document.
  -->
  <!-- omega_form_bg_traced.js — Canvas 2D renderer; initialized for section-two (flipped) -->
  <script src="js/omega_form_bg_traced.js?v=20"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof initOmegaFormBg === 'function') {
        window._section2Bg = initOmegaFormBg(document.querySelector('.section-two'), { revealFromBottom: true });
        window._section2Bg.setProgress(1);
      }
    });
  </script>
  <!-- section2_bg.js removed — form-bg appears once, not mirrored -->
  <!-- omega_form_submit.js — JSONP submit, no redirect; shows thank-you below button -->
  <script src="js/omega_form_submit.js?v=20"></script>
  <!-- omega_hero_lines.js — draws OMEGA eyebrow → thumb connecting line -->
  <script src="js/omega_hero_lines.js?v=20"></script>
  <!-- omega_intro.js — 2-second page-load entrance animation sequence -->
  <script src="js/omega_intro.js?v=20"></script>
  <!-- YouTube lightbox modal — iframe is injected on open, removed on close -->
  <div
    id="video-modal"
    class="video-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Omega — Life Is A Performance"
    hidden
  >
    <div class="video-modal__backdrop" aria-hidden="true"></div>
    <div class="video-modal__container">
      <button class="video-modal__close" aria-label="Close video">&times;</button>
      <div class="video-modal__frame"></div>
    </div>
  </div>

  <!-- omega_video_modal.js — must be after the modal HTML so getElementById finds it -->
  <script src="js/omega_video_modal.js?v=20"></script>
  <!-- omega_banner.js — switches banner from absolute (over video) to fixed on scroll -->
  <script src="js/omega_banner.js?v=20"></script>
  <!-- omega_popup.js — waitlist widget, slides in from bottom-right after 8s -->
  <script src="js/omega_popup.js?v=1"></script>

</body>
</html>
